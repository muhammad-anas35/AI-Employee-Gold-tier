[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai"
version = "1.0.0"
description = "Nexus - Your Personal AI Assistant for email, accounting, social media, and workflow automation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Muhammad Anas Asif", email = "ranabro353570@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "watchdog>=4.0",
    "psutil>=5.9",
    "schedule>=1.2",
    "python-dotenv>=1.0",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.1",
    "google-api-python-client>=2.100",
    "playwright>=1.40",
    "requests>=2.31",
    "xmlrpc-client>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "black>=23.0",
]

[project.scripts]
nexus = "nexus.__main__:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
